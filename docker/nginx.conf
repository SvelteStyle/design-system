# nginx config for the SvelteStyle docs site (static SPA).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Long-cache the hashed build assets (filenames change on rebuild).
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets: try the file, else fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Basic gzip for text assets.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
