name: Deploy to GitHub Pages

on:
  push:
    branches:
    - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs site
        uses: actions/checkout@v5

      # The library lives in a separate repo and is built from source. Vite
      # resolves it via STYLEBAKERY_LIB + /src/lib, so check it out there.
      # Public repo: the default token is enough. If SvelteStyle is private,
      # add a repo-scoped PAT as the LIB_REPO_TOKEN secret.
      - name: Checkout library source
        uses: actions/checkout@v5
        with:
          repository: sveltestyle/sveltestyle
          ref: master
          path: .lib/sveltestyle
          token: ${{ secrets.LIB_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Where vite.config.js expects the library checkout.
          STYLEBAKERY_LIB: .lib/sveltestyle
        run: npm run build

      - name: Add SPA fallback for deep links
        run: cp build/index.html build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
